[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmogridv11"
version = "0.1.0"
description = "Codes for CosmoGridV1.1 simulations."
readme = { file = "README.rst", content-type = "text/x-rst" }
requires-python = ">=3.6"
license = { text = "GNU General Public License v3" }
authors = [
  { name = "Tomasz Kacprzak", email = "tomasz.kacprzak@fhnw.ch" },
]
keywords = ["cosmogridv11"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.6",
  "Programming Language :: Python :: 3.7",
  "Programming Language :: Python :: 3.8",
]
dependencies = [
  "hmf==3.3.3",
  "halomod==2.0.0",
  "healpy",
  "tqdm",
  "h5py",
  "numba",
  "camb",
  "chaospy",
]

[project.urls]
Homepage = "https://github.com/tomaszkacprzak/cosmogridv11"

[project.scripts]
cosmogridv11 = "cosmogridv11.cli:main"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
include = ["cosmogridv11", "cosmogridv11.*"]
